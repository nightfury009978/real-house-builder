<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Cr House Builder Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 250px;
        }
        h2 { margin: 0 0 8px 0; font-size: 16px; color: #ffca28; }
        p { margin: 4px 0; font-size: 13px; }
        
        #build-menu {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 12px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .build-btn {
            background: #2c3e50;
            color: white;
            border: 2px solid #ffca28;
            padding: 10px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            transition: 0.2s;
        }
        .build-btn:hover { background: #ffca28; color: #000; }
    </style>
    <!-- Three.js Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- OrbitControls for mouse rotation/zoom -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <h2>₹100 Cr House Builder</h2>
        <p><strong>Budget:</strong> ₹<span id="budget-display">1,00,00,00,000</span></p>
        <p><strong>Sun:</strong> 45° Angle (Clear)</p>
        <p><strong>Water:</strong> 40 PSI Active</p>
    </div>

    <div id="build-menu">
        <button class="build-btn" onclick="spawnElement('wall', 500000, 0xdcdcdc)">🧱 Wall<br>₹5 Lakhs</button>
        <button class="build-btn" onclick="spawnElement('pillar', 200000, 0x555555)">🏛️ Pillar<br>₹2 Lakhs</button>
        <button class="build-btn" onclick="spawnElement('pool', 2500000, 0x1e90ff)">🏊 Pool<br>₹25 Lakhs</button>
    </div>

    <script>
        let budget = 1000000000; // 100 Crore

        // 1. Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(8, 8, 12);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Add Orbit Controls (Allows dragging to rotate view and scrolling to zoom)
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 3. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
        sunLight.position.set(15, 30, 15);
        scene.add(sunLight);

        // 4. Ground Site
        const groundGeometry = new THREE.PlaneGeometry(30, 30);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x4caf50 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // Grid helper to see layout boundaries
        const grid = new THREE.GridHelper(30, 30, 0xffffff, 0x335533);
        grid.position.y = 0.01;
        scene.add(grid);

        // Keep track of built items
        let placedObjects = [];
        let gridOffset = 0;

        // 5. Spawning Function linked to UI buttons
        function spawnElement(type, cost, color) {
            if (budget < cost) {
                alert("Insufficient Budget!");
                return;
            }
            budget -= cost;
            document.getElementById('budget-display').innerText = budget.toLocaleString('en-IN');

            let geometry, material, mesh;

            if (type === 'wall') {
                geometry = new THREE.BoxGeometry(3, 2, 0.4);
            } else if (type === 'pillar') {
                geometry = new THREE.CylinderGeometry(0.4, 0.4, 3, 16);
            } else if (type === 'pool') {
                geometry = new THREE.BoxGeometry(4, 0.8, 4);
            }

            material = new THREE.MeshLambertMaterial({ color: color });
            mesh = new THREE.Mesh(geometry, material);

            // Arrange newly spawned items in a neat row pattern automatically for now
            mesh.position.set((gridOffset % 4) * 3 - 4.5, type === 'pool' ? -0.3 : 1, Math.floor(gridOffset / 4) * 3 - 3);
            scene.add(mesh);
            placedObjects.push(mesh);
            gridOffset++;
        }

        // 6. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Responsive window scaling
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
