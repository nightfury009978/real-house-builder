<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>

.p{background:rgba(24,24,24,.9);border-radius:8px;padding:9px 11px;font-size:12px;box-shadow:0 2px 8px #0006;backdrop-filter:blur(4px)}
.p h3{margin:0 0 6px;font-size:12px;text-align:center;letter-spacing:.5px;font-weight:600}
#right{position:fixed;top:54px;right:8px;width:min(250px,52vw);display:flex;flex-direction:column;gap:7px;z-index:4}

#ut{position:fixed;bottom:8px;right:8px;z-index:4;max-width:calc(100vw - 16px)}
#pr{position:fixed;bottom:8px;left:50%;transform:translateX(-50%);z-index:3;width:150px;display:none}
@media(min-width:1100px){#pr{display:block;left:calc(50% + 120px)}}
.row{display:flex;gap:6px;overflow-x:auto;padding-bottom:3px;max-width:min(430px,92vw)}
.t{flex:0 0 78px;background:#2a2a2a;border:1px solid #555;border-radius:6px;color:#fff;padding:6px 3px;font-size:10px;cursor:pointer;text-align:center}
.t b{display:block;font-size:20px;font-weight:400}.t i{display:block;color:#ffc107;font-style:normal;margin-top:2px}
.t.on{border-color:#ffc107;background:#3d3a22;box-shadow:0 0 8px #ffc10799}
.hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:5px;font-weight:600;font-size:12px}
.lv button{background:#333;border:1px solid #666;color:#fff;border-radius:4px;font-size:10px;padding:2px 6px;cursor:pointer}.lv button.on{background:#ffc107;color:#000}
#side{position:fixed;right:8px;bottom:150px;display:flex;gap:6px;z-index:4}
#side button{background:rgba(24,24,24,.92);border:1px solid #555;border-radius:8px;width:38px;height:38px;color:#fff;font-size:17px;cursor:pointer}#side button.on{border-color:#e74c3c;background:#5a2020}
#toast{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#c0392b;padding:8px 16px;border-radius:6px;font-size:13px;opacity:0;transition:.3s;z-index:9;pointer-events:none}
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head><body>
<div id="bar"><button class="ib" onclick="help()" title="Help">☰</button><h1>ULTRA-REAL HOUSE BUILDER SIMULATOR</h1>
<span><button class="ib" onclick="toggleRain()" title="Rain / Sun">🌧</button><button class="ib" onclick="toggleTime()" title="Auto day-night">⏱</button><button class="ib" onclick="save(1)" title="Save">💾</button><button class="ib" onclick="resetAll()" title="Reset site">⚙</button></span></div>
<div id="right">
<div class="p" id="bud"></div>
<div class="p"><h3>ENVIRONMENTAL SIMULATION</h3><div id="e1"></div><div id="e2"></div><div id="e3"></div><div id="e4"></div></div>
<div class="p"><h3>MATERIALS &amp; RESOURCES</h3><div><span>🔩 Steel Beams:</span><b id="r_steel"></b></div><div><span>🧱 AAC Blocks:</span><b id="r_aac"></b></div><div><span>🔷 Solar Panels:</span><b id="r_solar"></b></div><div><span>🪵 Timber (ft³):</span><b id="r_timber"></b></div></div>
</div>
<div id="toast"></div>
<div class="p" id="tl"><div class="hd"><span>CONSTRUCTION TOOLS</span><span class="lv" id="lv"><button class="on" onclick="setL(0,this)">Ground</button> <button onclick="setL(1,this)">1st</button> <button onclick="setL(2,this)">2nd</button></span></div><div class="row" id="rt"></div></div>
<div class="p" id="pr"><h3>PROGRESS REPORT</h3><div id="pg"></div></div>
<div id="side"><button id="bu" onclick="undo()" title="Undo">↶</button><button onclick="rotate()" title="Rotate (R)">⟳</button><button id="be" onclick="toggleErase()" title="Eraser">🗑</button></div>
<div class="p" id="ut"><div class="hd"><span>UTILITIES</span></div><div class="row" id="ru"></div></div>
<script>
const T=THREE,$=id=>document.getElementById(id),rnd=Math.random;
const ren=new T.WebGLRenderer({antialias:true});ren.setPixelRatio(Math.min(devicePixelRatio,2));ren.setSize(innerWidth,innerHeight);
ren.shadowMap.enabled=true;ren.shadowMap.type=T.PCFSoftShadowMap;ren.outputEncoding=T.sRGBEncoding;ren.toneMapping=T.ACESFilmicToneMapping;
document.body.appendChild(ren.domElement);
const S=new T.Scene(),cam=new T.PerspectiveCamera(50,innerWidth/innerHeight,.1,700);cam.position.set(-18,10,24);
S.fog=new T.Fog(0xcfe3f3,70,260);
const oc=new T.OrbitControls(cam,ren.domElement);oc.target.set(2,2,2);oc.enableDamping=true;oc.maxPolarAngle=Math.PI/2-.03;oc.minDistance=4;oc.maxDistance=90;

/* ---------- procedural textures ---------- */
function tx(sz,fn,rx=1,ry=1){const c=document.createElement('canvas');c.width=c.height=sz;const g=c.getContext('2d');fn(g,sz);const t=new T.CanvasTexture(c);t.wrapS=t.wrapT=T.RepeatWrapping;t.repeat.set(rx,ry);t.anisotropy=8;t.encoding=T.sRGBEncoding;return t}
function noise(g,s,base,n,a=.12){g.fillStyle=base;g.fillRect(0,0,s,s);for(let i=0;i<n;i++){g.fillStyle=(rnd()>.5?'rgba(255,255,255,':'rgba(0,0,0,')+rnd()*a+')';g.fillRect(rnd()*s,rnd()*s,1+rnd()*3,1+rnd()*3)}}
const tBrick=tx(256,(g,s)=>{g.fillStyle='#b5aca2';g.fillRect(0,0,s,s);for(let r=0;r<16;r++)for(let c=-1;c<8;c++){const h=rnd()*34;g.fillStyle=`rgb(${150+h},${64+h/2},${46+h/3})`;g.fillRect(c*32+(r%2?16:0)+1,r*16+1,30,14)}},2,1.5);
const tWood=tx(256,(g,s)=>{for(let c=0;c<8;c++){const h=rnd()*22;g.fillStyle=`rgb(${150+h},${105+h},${62+h/2})`;g.fillRect(c*32,0,31,s);for(let i=0;i<40;i++){g.fillStyle='rgba(60,35,15,'+rnd()*.25+')';g.fillRect(c*32+rnd()*30,0,1,s)}g.fillStyle='#3a2410';g.fillRect(c*32+31,0,1,s)}},2,1.5);
const tConc=tx(256,(g,s)=>noise(g,s,'#a8a8a4',7000),2,2);
const tStone=tx(256,(g,s)=>{g.fillStyle='#444';g.fillRect(0,0,s,s);for(let r=0;r<8;r++){let x=0;while(x<s){const w=24+rnd()*40,v=70+rnd()*60;g.fillStyle=`rgb(${v},${v},${v+4})`;g.fillRect(x+1,r*32+1,w-2,30);x+=w}}},1,1.5);
const tGrass=tx(256,(g,s)=>noise(g,s,'#3f7a2e',9000,.2),30,30);
const tDirt=tx(256,(g,s)=>noise(g,s,'#6b4a2b',9000,.25),8,2);
const tSolar=tx(128,(g,s)=>{g.fillStyle='#0d1b52';g.fillRect(0,0,s,s);g.strokeStyle='#8fa4d8';g.lineWidth=1;for(let i=0;i<=8;i++){g.beginPath();g.moveTo(i*16,0);g.lineTo(i*16,s);g.moveTo(0,i*16);g.lineTo(s,i*16);g.stroke()}});
const tTile=tx(128,(g,s)=>{g.fillStyle='#3fb6d8';g.fillRect(0,0,s,s);g.strokeStyle='#bfe9f5';for(let i=0;i<=8;i++){g.beginPath();g.moveTo(i*16,0);g.lineTo(i*16,s);g.moveTo(0,i*16);g.lineTo(s,i*16);g.stroke()}},3,3);
const st=(c,r=.8,m=0,x={})=>new T.MeshStandardMaterial(Object.assign({color:c,roughness:r,metalness:m},x));
const M={conc:st(0xffffff,.9,0,{map:tConc}),brick:st(0xffffff,.85,0,{map:tBrick}),wood:st(0xffffff,.75,0,{map:tWood}),stone:st(0xffffff,.9,0,{map:tStone}),
raw:st(0xd8b27a,.8),dark:st(0x222222,.5,.6),white:st(0xeeeeee,.4,.2),blue:st(0x2e86de,.3,.6),red:st(0xc0392b,.6),org:st(0xe67e22,.5),
glass:st(0x9fd4f0,.05,.1,{transparent:true,opacity:.35}),roof:st(0x77777a,.8),solar:st(0xffffff,.2,.7,{map:tSolar}),gen:st(0xf2c21b,.5,.3),
tank:st(0x3d7bd6,.3,.4),tile:st(0xffffff,.4,0,{map:tTile}),water:st(0x2a9fd6,.05,.2,{transparent:true,opacity:.82}),trunk:st(0x5b3a1e,.9)};

/* ---------- sky, light, terrain ---------- */
const skyU={top:{value:new T.Color(0x3f7fc4)},bot:{value:new T.Color(0xcfe3f3)}};
S.add(new T.Mesh(new T.SphereGeometry(450,24,12),new T.ShaderMaterial({side:T.BackSide,depthWrite:false,fog:false,uniforms:skyU,
vertexShader:'varying float h;void main(){h=normalize(position).y;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
fragmentShader:'uniform vec3 top,bot;varying float h;void main(){gl_FragColor=vec4(mix(bot,top,pow(max(h,0.),.55)),1.);}'})));
const cc=document.createElement('canvas');cc.width=cc.height=128;{const g=cc.getContext('2d');for(let i=0;i<14;i++){const x=30+rnd()*70,y=50+rnd()*30,r=15+rnd()*25,gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,'rgba(255,255,255,.55)');gr.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=gr;g.fillRect(0,0,128,128)}}
const clouds=[];for(let i=0;i<16;i++){const s=new T.Sprite(new T.SpriteMaterial({map:new T.CanvasTexture(cc),fog:false,transparent:true,depthWrite:false}));const a=rnd()*6.28,d=150+rnd()*250;s.position.set(Math.cos(a)*d,60+rnd()*70,Math.sin(a)*d);s.scale.set(140+rnd()*100,70+rnd()*40,1);S.add(s);clouds.push(s)}
const hemi=new T.HemisphereLight(0xbfd9ff,0x5a4a35,.6);S.add(hemi);
const sun=new T.DirectionalLight(0xfff2dd,3);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);Object.assign(sun.shadow.camera,{left:-32,right:32,top:32,bottom:-32,near:1,far:200});sun.shadow.bias=-.0004;S.add(sun,sun.target);
const plat=new T.Mesh(new T.BoxGeometry(46,8,46),[M.dirt=st(0xffffff,1,0,{map:tDirt}),M.dirt,st(0xffffff,1,0,{map:tGrass}),M.dirt,M.dirt,M.dirt]);plat.position.y=-4;plat.receiveShadow=true;S.add(plat);
const out=new T.Mesh(new T.PlaneGeometry(900,900),st(0x3a6e2a,1,0,{map:tGrass}));out.rotation.x=-Math.PI/2;out.position.y=-.03;out.material.map=tGrass.clone();out.material.map.needsUpdate=true;out.material.map.repeat.set(200,200);out.receiveShadow=true;S.add(out);
{const n=5000,im=new T.InstancedMesh(new T.ConeGeometry(.04,.4,3),st(0xffffff,1),n),d=new T.Object3D(),c=new T.Color();
for(let i=0;i<n;i++){d.position.set((rnd()-.5)*45,.18,(rnd()-.5)*45);d.rotation.set((rnd()-.5)*.4,rnd()*6,(rnd()-.5)*.4);d.scale.setScalar(.6+rnd()*.9);d.updateMatrix();im.setMatrixAt(i,d.matrix);im.setColorAt(i,c.setHSL(.25+rnd()*.06,.55,.22+rnd()*.14))}S.add(im)}

/* ---------- component builders ---------- */
const bx=(w,h,d,m,x=0,y=0,z=0)=>{const o=new T.Mesh(new T.BoxGeometry(w,h,d),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;return o};
const cy=(r,h,m,x=0,y=0,z=0,s=16)=>{const o=new T.Mesh(new T.CylinderGeometry(r,r,h,s),m);o.position.set(x,y,z);o.castShadow=o.receiveShadow=true;return o};
const G=(...a)=>{const g=new T.Group();a.flat().forEach(o=>g.add(o));return g};
const D={
slab:{n:'Slab / Foundation',ic:'⬜',c:800000,r:{steel:6},dy:0,mk:()=>G(bx(4,.5,4,M.conc,0,.25,0),bx(4.04,.05,4.04,M.dark,0,.45,0))},
frame:{n:'Wall Frame',ic:'🪟',c:300000,r:{timber:40},dy:.5,mk:()=>{const a=[];for(let i=0;i<9;i++)a.push(bx(.1,3,.1,M.raw,-2+i*.5,1.5,0));a.push(bx(4,.12,.14,M.raw,0,.06),bx(4,.12,.14,M.raw,0,2.94),bx(4,.12,.14,M.raw,0,1.5),bx(4,.04,.04,M.blue,0,.6,.1),bx(4,.04,.04,M.red,0,.7,.1),bx(4,.04,.04,M.org,0,.8,.1));const b=bx(.07,4.2,.07,M.raw,0,1.5,0);b.rotation.z=.64;a.push(b);return G(a)}},
brick:{n:'Brick Wall',ic:'🧱',c:500000,r:{aac:300},dy:.5,mk:()=>G(bx(4,3,.3,M.brick,0,1.5,0))},
clad:{n:'Timber Cladding',ic:'🪵',c:450000,r:{timber:60},dy:.5,mk:()=>G(bx(4,3,.3,M.wood,0,1.5,0))},
glass:{n:'Glass Panel',ic:'🔲',c:900000,r:{steel:2},dy:.5,mk:()=>G(bx(4,.12,.22,M.dark,0,.06),bx(4,.12,.22,M.dark,0,2.94),[-2,-.67,.67,2].map(x=>bx(.08,3,.22,M.dark,x,1.5)),bx(3.9,2.9,.04,M.glass,0,1.5))},
stone:{n:'Stone Column',ic:'🗿',c:350000,r:{aac:120},dy:.5,mk:()=>G(bx(1.2,3.4,1.2,M.stone,0,1.7,0))},
roof:{n:'Roof Slab',ic:'🏠',c:700000,r:{steel:8},dy:.5,mk:()=>G(bx(4.6,.3,4.6,M.roof,0,3.15,0),bx(4.6,.08,4.6,M.wood,0,2.96,0))},
hvac:{n:'HVAC Unit',ic:'❄️',c:1200000,r:{steel:1},g:1,mk:()=>{const g=G(bx(1.3,1,.6,M.white,0,.5,0),cy(.34,.05,M.dark,0,.5,.31,24),bx(1.1,.02,.02,M.dark,0,.5,.34));g.children[1].rotation.x=Math.PI/2;const f=bx(.6,.04,.05,M.dark,0,.5,.34);g.add(f);g.userData.fan=f;return g}},
pipe:{n:'Water Pipe',ic:'🔧',c:50000,r:{steel:1},g:1,mk:()=>{const p=cy(.09,4,M.blue,0,.15,0,10);p.rotation.z=Math.PI/2;return G(p,cy(.13,.2,M.blue,-2,.15,0),cy(.13,.2,M.blue,2,.15,0))}},
solar:{n:'Solar Panel',ic:'☀️',c:3000000,r:{solar:4},dy:3.8,mk:()=>{const p=bx(3.6,.08,2.4,M.solar,0,.7,0);p.rotation.x=-.4;return G(p,bx(.1,.6,.1,M.dark,-1.5,.3,.6),bx(.1,.6,.1,M.dark,1.5,.3,.6),bx(.1,.2,.1,M.dark,-1.5,.1,-.7),bx(.1,.2,.1,M.dark,1.5,.1,-.7))}},
gen:{n:'Generator',ic:'⚡',c:1000000,r:{steel:2},g:1,mk:()=>G(bx(1.7,.8,1.1,M.gen,0,.6,0),bx(.5,.5,1,M.dark,.5,1.2,0),bx(.08,.08,1.2,M.dark,-.8,.2,0),bx(.08,.08,1.2,M.dark,.8,.2,0),cy(.1,.3,M.dark,-.5,1.15,0))},
tank:{n:'Water Tank',ic:'🚰',c:400000,r:{steel:2},g:1,mk:()=>G(cy(.9,1.8,M.tank,0,2,0,24),cy(.3,.2,M.dark,0,3,0),[[-.6,-.6],[.6,-.6],[-.6,.6],[.6,.6]].map(p=>bx(.1,1.1,.1,M.dark,p[0],.55,p[1])))},
pool:{n:'Swimming Pool',ic:'🏊',c:2500000,r:{aac:400},g:1,mk:()=>{const w=new T.Mesh(new T.PlaneGeometry(5.4,5.4,12,12),M.water);w.rotation.x=-Math.PI/2;w.position.y=1.15;w.receiveShadow=true;const g=G(bx(6,.15,6,M.tile,0,.08,0),bx(6,1.4,.3,M.conc,0,.7,2.85),bx(6,1.4,.3,M.conc,0,.7,-2.85),bx(.3,1.4,5.4,M.conc,2.85,.7,0),bx(.3,1.4,5.4,M.conc,-2.85,.7,0),w);g.userData.w=w;return g}},
tree:{n:'Tree',ic:'🌳',c:200000,r:{},g:1,mk:()=>{const g=G(cy(.15,1.8,M.trunk,0,.9,0,8)),m=[st(0x2f6b2a,1),st(0x3c8a35,1)];[[0,2.3,0,1.2],[.5,1.8,.2,.85],[-.4,2.8,-.2,.8]].forEach((p,i)=>{const f=new T.Mesh(new T.IcosahedronGeometry(p[3],1),m[i%2]);f.material.flatShading=true;f.position.set(p[0],p[1],p[2]);f.castShadow=true;g.add(f)});g.userData.tree=1;return g}}
};
const RN={steel:'Steel Beams',aac:'AAC Blocks',solar:'Solar Panels',timber:'Timber'};
const fmt=p=>p>=1e7?p/1e7+'Cr':p>=1e5?p/1e5+'L':p/1e3+'K';

/* ---------- construction props ---------- */
{const sh=G(bx(1.6,.1,.4,M.raw,0,.8),[-.7,.7].map(x=>bx(.1,.8,.4,M.raw,x,.4)),bx(.5,.3,.3,M.org,.2,1.02));sh.position.set(-8,0,9);S.add(sh);
const tp=G(bx(.25,.25,.25,M.org,0,1.75),[0,2.1,4.2].map(a=>{const l=cy(.03,1.7,M.dark,Math.sin(a)*.4,.85,Math.cos(a)*.4);l.rotation.set(Math.cos(a)*.25,0,-Math.sin(a)*.25);return l}));tp.position.set(-11,0,5);S.add(tp);
const ws=G([0,1,2].map(i=>bx(2.4,.12,.3,M.raw,0,.1+i*.14,0)));ws.position.set(12,0,-7);S.add(ws);
const gl=G(cy(.05,.8,M.gen),[0,1].map(i=>bx(.08,.1,3,M.raw,0,.05+i*.1,0)));gl.position.set(-6,0,12);S.add(gl);S.traverse(o=>{if(o.isMesh)o.castShadow=true})}

/* ---------- state ---------- */
let budget=1e9,res={steel:450,aac:15000,solar:88,timber:1200},placed=[],occ=new Set(),tool=null,erase=false,lvl=0,rot=0,tod=13,autoT=false,rain=false,tank=.8,wind=.4,ghost=null,gv=false,gp={x:0,z:0};
const gm=new T.MeshBasicMaterial({color:0x00ff66,transparent:true,opacity:.45,depthWrite:false});
const ac=new(window.AudioContext||window.webkitAudioContext)();
function sfx(f1,f2){try{ac.resume();const o=ac.createOscillator(),g=ac.createGain();o.connect(g);g.connect(ac.destination);o.frequency.setValueAtTime(f1,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f2,ac.currentTime+.15);g.gain.setValueAtTime(.2,ac.currentTime);g.gain.exponentialRampToValueAtTime(.01,ac.currentTime+.15);o.start();o.stop(ac.currentTime+.16)}catch(e){}}
function toast(m){const t=$('toast');t.textContent=m;t.style.opacity=1;clearTimeout(t._h);t._h=setTimeout(()=>t.style.opacity=0,1800)}
function place(t,x,z,L,r,mode=0){const d=D[t],key=[t,x,z,d.g?0:L,r].join('|');
 if(occ.has(key))return;
 if(mode==0){if(budget<d.c)return toast('Insufficient budget!');for(const k in d.r)if(res[k]<d.r[k])return toast('Out of '+RN[k])}
 const g=d.mk();g.position.set(x,d.g?0:L*3.5+d.dy,z);g.rotation.y=r*Math.PI/2;S.add(g);
 placed.push({g,t,x,z,L,r,key});occ.add(key);
 if(mode<2){budget-=d.c;for(const k in d.r)res[k]-=d.r[k]}
 if(mode==0){sfx(300,650);save()}ui()}
function remove(p,f){const d=D[p.t];S.remove(p.g);occ.delete(p.key);placed.splice(placed.indexOf(p),1);budget+=Math.floor(d.c*f);for(const k in d.r)res[k]+=Math.floor(d.r[k]*f);sfx(260,90);save();ui()}
function undo(){const p=placed[placed.length-1];if(p)remove(p,1)}
function save(m){try{localStorage.setItem('hbsim3',JSON.stringify({p:placed.map(p=>[p.t,p.x,p.z,p.L,p.r]),b:budget,r:res}));if(m)toast('Saved ✔')}catch(e){}}
function resetAll(){if(confirm('Reset the entire construction site?')){try{localStorage.removeItem('hbsim3')}catch(e){}location.reload()}}
function help(){alert('Drag = orbit • Right-drag = pan • Scroll/pinch = zoom\nTap a tool, then tap the ground to build (green = valid).\nR or ⟳ = rotate • ↶ = undo • 🗑 = eraser (50% refund)\nFloor buttons raise the build level. 🌧 rain, ⏱ day-night cycle, 💾 save.')}

/* ---------- UI ---------- */
function mkBtns(ids,el){ids.forEach(id=>{const b=document.createElement('button'),d=D[id];b.className='t';b.id='t_'+id;b.innerHTML=`<b>${d.ic}</b>${d.n}<i>${fmt(d.c)} Coins</i>`;b.onclick=()=>selTool(id);$(el).appendChild(b)})}
mkBtns(['slab','frame','brick','clad','glass','stone','roof'],'rt');mkBtns(['hvac','pipe','solar','gen','tank','pool','tree'],'ru');
function selTool(id){erase=false;$('be').classList.remove('on');tool=tool==id?null:id;document.querySelectorAll('.t').forEach(b=>b.classList.toggle('on',b.id=='t_'+tool));mkGhost()}
function toggleErase(){erase=!erase;tool=null;document.querySelectorAll('.t').forEach(b=>b.classList.remove('on'));$('be').classList.toggle('on',erase);mkGhost()}
function setL(l,b){lvl=l;document.querySelectorAll('#lv button').forEach(x=>x.classList.remove('on'));b.classList.add('on')}
function rotate(){rot=(rot+1)%4;if(ghost)ghost.rotation.y=rot*Math.PI/2}
addEventListener('keydown',e=>{if(e.key=='r'||e.key=='R')rotate();if(e.key=='Escape'){tool=null;erase=false;selTool(null)}});
function toggleRain(){rain=!rain;rainM.visible=rain;toast(rain?'Rain started':'Clear skies')}
function toggleTime(){autoT=!autoT;toast(autoT?'Day-night cycle ON':'Day-night cycle OFF')}
const cnt=a=>placed.filter(p=>a.includes(p.t)).length;
function ui(){$('bud').textContent='BUDGET: 100 Crore Coins (Remaining: '+Math.floor(budget).toLocaleString('en-IN')+')';
 for(const k in res)$('r_'+k).textContent=res[k].toLocaleString('en-IN');
 const s=Math.min(100,Math.round(cnt(['slab','frame','brick','clad','glass','stone','roof'])/40*100)),y=Math.min(100,Math.round(cnt(['hvac','pipe','solar','gen','tank','pool'])/16*100));
 $('pg').innerHTML=`<div>Structural: ${s}%</div><div>Systems: ${y}%</div>`}

/* ---------- ghost & input ---------- */
function mkGhost(){if(ghost)S.remove(ghost);ghost=null;if(!tool)return;ghost=D[tool].mk();ghost.traverse(o=>{if(o.isMesh){o.material=gm;o.castShadow=false}});ghost.rotation.y=rot*Math.PI/2;ghost.visible=false;S.add(ghost)}
const ray=new T.Raycaster(),mv=new T.Vector2(),pt=new T.Vector3();
function setM(e){mv.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(mv,cam)}
function updGhost(){if(!ghost)return;const d=D[tool],y=d.g?0:lvl*3.5;if(!ray.ray.intersectPlane(new T.Plane(new T.Vector3(0,1,0),-y),pt)){ghost.visible=false;gv=false;return}
 gp.x=Math.max(-20,Math.min(20,Math.round(pt.x/2)*2));gp.z=Math.max(-20,Math.min(20,Math.round(pt.z/2)*2));
 ghost.position.set(gp.x,y+(d.g?0:d.dy),gp.z);ghost.visible=true;
 gv=!occ.has([tool,gp.x,gp.z,d.g?0:lvl,rot].join('|'));gm.color.setHex(gv?0x00ff66:0xff3030)}
let pd=null;
addEventListener('pointerdown',e=>{pd={x:e.clientX,y:e.clientY,t:Date.now()}});
addEventListener('pointermove',e=>{if(e.target!==ren.domElement)return;setM(e);updGhost()});
addEventListener('pointerup',e=>{if(!pd||e.target!==ren.domElement)return;if(Math.hypot(e.clientX-pd.x,e.clientY-pd.y)>6||Date.now()-pd.t>400)return;setM(e);
 if(erase){const h=ray.intersectObjects(placed.map(p=>p.g),true)[0];if(h){let o=h.object,p;while(o&&!(p=placed.find(q=>q.g===o)))o=o.parent;if(p)remove(p,.5)}}
 else if(tool){updGhost();if(gv)place(tool,gp.x,gp.z,lvl,rot)}});

/* ---------- rain ---------- */
const rp=new Float32Array(1800*6);for(let i=0;i<1800;i++){const x=(rnd()-.5)*50,y=rnd()*30,z=(rnd()-.5)*50;rp.set([x,y,z,x,y-.6,z],i*6)}
const rg=new T.BufferGeometry();rg.setAttribute('position',new T.BufferAttribute(rp,3));
const rainM=new T.LineSegments(rg,new T.LineBasicMaterial({color:0xaabbdd,transparent:true,opacity:.5}));rainM.visible=false;rainM.frustumCulled=false;S.add(rainM);

/* ---------- environment ---------- */
const cD=new T.Color(0x3f7fc4),cN=new T.Color(0x040a1c),bD=new T.Color(0xcfe3f3),bN=new T.Color(0x0a1226),cO=new T.Color(0xff9a5a),gray=new T.Color(0x7d8791);let envK=1,eAcc=0;
function env(dt){if(autoT){tod+=dt*.35;if(tod>=24)tod-=24}
 const a=(tod-6)/12*Math.PI,sn=Math.sin(a),k=Math.max(0,Math.min(1,sn*3)),rk=rain?.55:0;
 sun.position.set(-Math.cos(a)*60,Math.max(sn,.02)*60,25).add(sun.target.position);sun.intensity=k*3*(1-rk*.7);
 hemi.intensity=.12+.55*k;ren.toneMappingExposure=.75+.35*k;
 skyU.top.value.lerpColors(cN,cD,k).lerp(gray,rk*k);skyU.bot.value.lerpColors(bN,bD,k).lerp(cO,Math.max(0,(1-k)*k*2.2)*(1-rk)).lerp(gray,rk*.6);S.fog.color.copy(skyU.bot.value);
 clouds.forEach(c=>c.material.opacity=(.25+.75*k)*(rain?1:.8));
 eAcc+=dt;if(eAcc<.3)return;eAcc=0;
 const h=Math.floor(tod),m=Math.floor((tod-h)*60),hc=cnt(['hvac']),tk=cnt(['tank']),pp=cnt(['pipe']);
 if(rain)tank=Math.min(1,tank+.01);else tank=Math.max(.15,tank-.0008*(pp+1));
 const temp=Math.round(14+14*Math.max(0,sn)-(rain?4:0)),ins=Math.max(21,temp-hc*3);
 $('e1').innerHTML=`<span>☀️ SUN (Intensity: ${(k*10).toFixed(1)}, ${Math.max(0,Math.round(a*180/Math.PI))}°)</span>`;
 $('e2').innerHTML=`<span>💨 AIR (Flow: ${wind>.8?'High':wind>.4?'Medium':'Low'}, Temp: ${hc?ins:temp}°C)</span>`;
 $('e3').innerHTML=`<span>💧 WATER (${tk?Math.min(80,20+tk*25+pp*2)+' PSI, Tank: '+Math.round(tank*100)+'% Full':'No tank'})</span>`;
 $('e4').innerHTML=`<span>⛅ ${rain?'Rainy':'Mostly Sunny'}, ${wind>.8?'High':'Low'} Wind • ${(h%12||12)}:${m<10?'0':''}${m} ${h>=12?'PM':'AM'}</span>`}

/* ---------- loop ---------- */
const clk=new T.Clock();
function loop(){requestAnimationFrame(loop);const dt=Math.min(clk.getDelta(),.1),t=clk.elapsedTime;
 wind=.45+.4*Math.sin(t*.15)+(rain?.4:0);env(dt);
 clouds.forEach(c=>{c.position.x+=wind*dt*3;if(c.position.x>420)c.position.x=-420});
 placed.forEach(p=>{const u=p.g.userData;if(u.tree){p.g.rotation.z=Math.sin(t*2+p.x)*.015*wind*3;p.g.rotation.x=Math.cos(t*1.7+p.z)*.012*wind*3}
  if(u.fan)u.fan.rotation.z=t*12;
  if(u.w){const a=u.w.geometry.attributes.position;for(let i=0;i<a.count;i++)a.setZ(i,Math.sin(a.getX(i)*2+t*2)*.03+Math.cos(a.getY(i)*2.4+t*1.6)*.03);a.needsUpdate=true}});
 if(rain){const a=rg.attributes.position.array;for(let i=0;i<1800;i++){const j=i*6;a[j+1]-=.9;a[j+4]-=.9;if(a[j+1]<0){a[j+1]=30;a[j+4]=29.4}}rg.attributes.position.needsUpdate=true}
 oc.update();ren.render(S,cam)}
addEventListener('resize',()=>{cam.aspect=innerWidth/innerHeight;cam.updateProjectionMatrix();ren.setSize(innerWidth,innerHeight)});

/* ---------- initial site (starter house) or saved game ---------- */
let sv=null;try{sv=JSON.parse(localStorage.getItem('hbsim3'))}catch(e){}
if(sv&&sv.p){budget=sv.b;res=sv.r;sv.p.forEach(p=>place(p[0],p[1],p[2],p[3],p[4],2))}
else{const P=(t,x,z,L=0,r=0)=>place(t,x,z,L,r,1);
 [-4,0,4].forEach(x=>[0,4].forEach(z=>P('slab',x,z)));
 [-4,0,4].forEach(x=>P('brick',x,-2));P('brick',6,0,0,1);P('brick',6,4,0,1);
 P('frame',-6,0,0,1);P('frame',-6,4,0,1);P('frame',-4,6);P('glass',0,6);P('glass',4,6);P('stone',6,6);P('stone',6,-2);
 [0,4].forEach(x=>[0,4].forEach(z=>{P('slab',x,z,1);P('roof',x,z,1)}));
 [0,4].forEach(x=>{P('clad',x,-2,1);P('glass',x,6,1)});[0,4].forEach(z=>{P('glass',6,z,1,1);P('clad',-2,z,1,1)});
 P('solar',0,0,1);P('solar',4,0,1);P('pool',12,3);P('gen',10,-4);P('hvac',9,-1);P('tank',-10,-4);P('pipe',-10,0,0,0);P('pipe',-10,2,0,0);
 [[-15,-9],[16,-11],[-13,12],[15,13],[-18,2]].forEach(p=>P('tree',p[0],p[1]));save()}
ui();ren.domElement.addEventListener('wheel',()=>{},{passive:true});loop();
</script></body></html>
