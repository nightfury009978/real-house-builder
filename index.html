<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Cr House Builder Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; touch-action: none; }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.85);
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 260px;
            pointer-events: none;
        }
        h2 { margin: 0 0 6px 0; font-size: 15px; color: #ffca28; }
        p { margin: 3px 0; font-size: 12px; }
        
        #env-controls {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-size: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            z-index: 10;
        }
        .env-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 5px;
            width: 100%;
        }
        .env-btn:hover { background: #2ecc71; }

        #build-menu {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 10;
        }
        .build-btn {
            background: #2c3e50;
            color: white;
            border: 2px solid #555;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
        }
        .build-btn.selected {
            border-color: #ffca28;
            background: #34495e;
            box-shadow: 0 0 8px #ffca28;
        }
    </style>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <h2>₹100 Cr House Builder</h2>
        <p><strong>Budget:</strong> ₹<span id="budget-display">99,48,00,000</span></p>
        <p><strong>Selected:</strong> <span id="tool-display" style="color: #ffca28;">None</span></p>
        <p><strong>Sun Angle:</strong> <span id="sun-display">45° (Clear)</span></p>
        <p><strong>Weather:</strong> <span id="weather-display" style="color: #4cd137;">Sunny</span></p>
        <p><strong>Water Pressure:</strong> <span id="water-display">40 PSI</span></p>
    </div>

    <div id="env-controls">
        <strong>Environment Sim</strong>
        <p style="margin-top:5px;">Cycle Sun Angle:</p>
        <button class="env-btn" onclick="toggleSun()">☀️ Change Sun Position</button>
        <p style="margin-top:8px;">Weather State:</p>
        <button class="env-btn" style="background:#e67e22;" onclick="toggleWeather()">🌧️ Toggle Rain/Sun</button>
    </div>

    <div id="build-menu">
        <button id="btn-wall" class="build-btn" onclick="selectTool('wall', 500000, 0xdcdcdc)">🧱 Wall<br>₹5 Lakhs</button>
        <button id="btn-pillar" class="build-btn" onclick="selectTool('pillar', 200000, 0x555555)">🏛️ Pillar<br>₹2 Lakhs</button>
        <button id="btn-pool" class="build-btn" onclick="selectTool('pool', 2500000, 0x1e90ff)">🏊 Pool<br>₹25 Lakhs</button>
    </div>

    <script>
        let budget = 994800000;
        let currentTool = null;
        let sunState = 1; // 1: Morning, 2: Noon, 3: Evening
        let isRaining = false;

        // 1. Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 12, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        // 2. Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 3. Lighting & Shadows
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(15, 30, 15);
        sunLight.castShadow = true;
        scene.add(sunLight);

        // 4. Ground plane
        const groundGeometry = new THREE.PlaneGeometry(30, 30);
        const groundMaterial = new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.8 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        ground.receiveShadow = true;
        scene.add(ground);

        const grid = new THREE.GridHelper(30, 30, 0xffffff, 0x2e7d32);
        grid.position.y = 0.01;
        scene.add(grid);

        // 5. Rain Particle System
        const raindropCount = 500;
        const rainGeometry = new THREE.BufferGeometry();
        const rainPositions = [];
        for (let i = 0; i < raindropCount; i++) {
            rainPositions.push((Math.random() - 0.5) * 30, Math.random() * 20, (Math.random() - 0.5) * 30);
        }
        rainGeometry.setAttribute('position', new THREE.Float32BufferAttribute(rainPositions, 3));
        const rainMaterial = new THREE.PointsMaterial({ color: 0xaaaaff, size: 0.15, transparent: true, opacity: 0.7 });
        const rainSystem = new THREE.Points(rainGeometry, rainMaterial);
        rainSystem.visible = false;
        scene.add(rainSystem);

        // Environmental Toggle Functions
        function toggleSun() {
            sunState = (sunState % 3) + 1;
            if (sunState === 1) {
                sunLight.position.set(-20, 10, 15);
                sunLight.color.setHex(0xffaa33); // Golden Morning Sun
                scene.background.setHex(0xcc8855);
                document.getElementById('sun-display').innerText = "15° (Morning)";
            } else if (sunState === 2) {
                sunLight.position.set(0, 30, 0);
                sunLight.color.setHex(0xffffff); // Direct Overhead Noon Sun
                scene.background.setHex(0x87ceeb);
                document.getElementById('sun-display').innerText = "90° (Noon)";
            } else {
                sunLight.position.set(20, 10, -15);
                sunLight.color.setHex(0xff5500); // Sunset Orange
                scene.background.setHex(0x332244);
                document.getElementById('sun-display').innerText = "165° (Evening)";
            }
        }

        function toggleWeather() {
            isRaining = !isRaining;
            rainSystem.visible = isRaining;
            if (isRaining) {
                document.getElementById('weather-display').innerText = "Heavy Rain";
                document.getElementById('weather-display').style.color = "#00d2d3";
                document.getElementById('water-display').innerText = "65 PSI (Tank Filling)";
            } else {
                document.getElementById('weather-display').innerText = "Sunny";
                document.getElementById('weather-display').style.color = "#4cd137";
                document.getElementById('water-display').innerText = "40 PSI";
            }
        }

        // Preview Ghost Box
        const previewMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 });
        let previewMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), previewMaterial);
        previewMesh.visible = false;
        scene.add(previewMesh);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let pointerDownTime = 0;

        function selectTool(type, cost, color) {
            document.querySelectorAll('.build-btn').forEach(btn => btn.classList.remove('selected'));
            
            if (currentTool && currentTool.type === type) {
                currentTool = null;
                previewMesh.visible = false;
                document.getElementById('tool-display').innerText = "None";
                return;
            }

            currentTool = { type, cost, color };
            document.getElementById(`btn-${type}`).classList.add('selected');
            document.getElementById('tool-display').innerText = type.toUpperCase();

            if (type === 'wall') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.BoxGeometry(3, 2, 0.4);
            } else if (type === 'pillar') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.CylinderGeometry(0.4, 0.4, 3, 16);
            } else if (type === 'pool') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.BoxGeometry(4, 0.8, 4);
            }
            previewMesh.visible = true;
        }

        window.addEventListener('pointermove', (event) => {
            let clientX = event.clientX || (event.touches && event.touches[0].clientX);
            let clientY = event.clientY || (event.touches && event.touches[0].clientY);
            if (!clientX || !clientY) return;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);

            if (intersects.length > 0 && currentTool) {
                const point = intersects[0].point;
                previewMesh.position.set(Math.round(point.x), currentTool.type === 'pool' ? -0.3 : 1.5, Math.round(point.z));
            }
        });

        window.addEventListener('pointerdown', () => { pointerDownTime = Date.now(); });

        window.addEventListener('pointerup', (event) => {
            if (Date.now() - pointerDownTime > 250) return;
            if (!currentTool || event.target.closest('#build-menu') || event.target.closest('#env-controls')) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);

            if (intersects.length > 0) {
                if (budget < currentTool.cost) {
                    alert("Insufficient Budget!");
                    return;
                }

                const point = intersects[0].point;
                let geometry, material, mesh;

                if (currentTool.type === 'wall') {
                    geometry = new THREE.BoxGeometry(3, 2, 0.4);
                } else if (currentTool.type === 'pillar') {
                    geometry = new THREE.CylinderGeometry(0.4, 0.4, 3, 16);
                } else if (currentTool.type === 'pool') {
                    geometry = new THREE.BoxGeometry(4, 0.8, 4);
                }

                material = new THREE.MeshStandardMaterial({ color: currentTool.color, roughness: 0.4 });
                mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;

                mesh.position.set(Math.round(point.x), currentTool.type === 'pool' ? -0.3 : 1.5, Math.round(point.z));
                scene.add(mesh);

                budget -= currentTool.cost;
                document.getElementById('budget-display').innerText = budget.toLocaleString('en-IN');
            }
        });

        // 6. Animation Loop (Handles Rain & Rendering)
        function animate() {
            requestAnimationFrame(animate);

            if (isRaining) {
                const positions = rainSystem.geometry.attributes.position.array;
                for (let i = 1; i < positions.length; i += 3) {
                    positions[i] -= 0.5; // Rain fall speed
                    if (positions[i] < 0) positions[i] = 20;
                }
                rainSystem.geometry.attributes.position.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
