<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Cr House Builder Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        h2 { margin: 0 0 10px 0; font-size: 18px; color: #ffca28; }
        p { margin: 5px 0; font-size: 14px; }
    </style>
    <!-- Importing Three.js for 3D graphics -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <h2>₹100 Crore House Builder</h2>
        <p><strong>Remaining Budget:</strong> ₹<span id="budget">1,000,000,000</span></p>
        <p><strong>Sun Position:</strong> 45° Angle</p>
        <p><strong>Water Pressure:</strong> 40 PSI</p>
    </div>

    <script>
        // 1. Setup 3D Scene, Camera, and Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb); // Sky blue background

        const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(5, 5, 10);
        camera.lookAt(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Add Lighting (Sunlight simulation)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1);
        sunLight.position.set(10, 20, 10);
        scene.add(sunLight);

        // 3. Ground / Construction Site
        const groundGeometry = new THREE.PlaneGeometry(20, 20);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x557a46 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        // 4. Starter Structure Element (Foundation Concrete Block)
        const blockGeometry = new THREE.BoxGeometry(2, 1, 2);
        const blockMaterial = new THREE.MeshLambertMaterial({ color: 0x888888 });
        const foundation = new THREE.Mesh(blockGeometry, blockMaterial);
        foundation.position.set(0, 0.5, 0);
        scene.add(foundation);

        // 5. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            // Slow rotatation for demonstration
            foundation.rotation.y += 0.005;
            renderer.render(scene, camera);
        }
        animate();

        // Handle window resizing
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
