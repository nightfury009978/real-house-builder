<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Cr House Builder Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; touch-action: none; }
        #ui-overlay {
            position: absolute;
            top: 15px;
            left: 15px;
            color: #ffffff;
            background: rgba(0, 0, 0, 0.85);
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            max-width: 260px;
            pointer-events: none;
        }
        h2 { margin: 0 0 8px 0; font-size: 16px; color: #ffca28; }
        p { margin: 4px 0; font-size: 13px; }
        
        #build-menu {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.85);
            padding: 10px;
            border-radius: 10px;
            display: flex;
            gap: 10px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
            z-index: 10;
        }
        .build-btn {
            background: #2c3e50;
            color: white;
            border: 2px solid #555;
            padding: 10px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 12px;
            text-align: center;
            transition: 0.2s;
        }
        .build-btn.selected {
            border-color: #ffca28;
            background: #34495e;
            box-shadow: 0 0 8px #ffca28;
        }
        #instruction {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(0, 0, 0, 0.75);
            color: #4caf50;
            padding: 10px 15px;
            border-radius: 6px;
            font-size: 13px;
            font-weight: bold;
            pointer-events: none;
        }
    </style>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="ui-overlay">
        <h2>₹100 Cr House Builder</h2>
        <p><strong>Budget:</strong> ₹<span id="budget-display">1,00,00,00,000</span></p>
        <p><strong>Selected Tool:</strong> <span id="tool-display" style="color: #ffca28;">None</span></p>
        <p><strong>Sun:</strong> 45° Angle (Clear)</p>
        <p><strong>Water:</strong> 40 PSI Active</p>
    </div>

    <div id="instruction">Tap screen to place selected item</div>

    <div id="build-menu">
        <button id="btn-wall" class="build-btn" onclick="selectTool('wall', 500000, 0xdcdcdc)">🧱 Wall<br>₹5 Lakhs</button>
        <button id="btn-pillar" class="build-btn" onclick="selectTool('pillar', 200000, 0x555555)">🏛️ Pillar<br>₹2 Lakhs</button>
        <button id="btn-pool" class="build-btn" onclick="selectTool('pool', 2500000, 0x1e90ff)">🏊 Pool<br>₹25 Lakhs</button>
    </div>

    <script>
        let budget = 1000000000; // ₹100 Crore
        let currentTool = null;

        // 1. Scene, Camera, Renderer
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 12, 16);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        document.body.appendChild(renderer.domElement);

        // 2. Controls
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;

        // 3. Lighting
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 0.9);
        sunLight.position.set(15, 30, 15);
        scene.add(sunLight);

        // 4. Ground plane
        const groundGeometry = new THREE.PlaneGeometry(30, 30);
        const groundMaterial = new THREE.MeshLambertMaterial({ color: 0x4caf50 });
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.rotation.x = -Math.PI / 2;
        scene.add(ground);

        const grid = new THREE.GridHelper(30, 30, 0xffffff, 0x2e7d32);
        grid.position.y = 0.01;
        scene.add(grid);

        // 5. Preview Ghost Box (Shows where you are aiming)
        const previewMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 });
        let previewMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), previewMaterial);
        previewMesh.visible = false;
        scene.add(previewMesh);

        // Raycasting setup for tap/click detection
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let pointerDownTime = 0;

        function selectTool(type, cost, color) {
            document.querySelectorAll('.build-btn').forEach(btn => btn.classList.remove('selected'));
            
            if (currentTool && currentTool.type === type) {
                currentTool = null;
                previewMesh.visible = false;
                document.getElementById('tool-display').innerText = "None";
                return;
            }

            currentTool = { type, cost, color };
            document.getElementById(`btn-${type}`).classList.add('selected');
            document.getElementById('tool-display').innerText = type.toUpperCase();

            // Update preview mesh shape based on selected tool
            if (type === 'wall') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.BoxGeometry(3, 2, 0.4);
            } else if (type === 'pillar') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.CylinderGeometry(0.4, 0.4, 3, 16);
            } else if (type === 'pool') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.BoxGeometry(4, 0.8, 4);
            }
            previewMesh.visible = true;
        }

        function updatePointerPosition(event) {
            let clientX = event.clientX || (event.touches && event.touches[0].clientX);
            let clientY = event.clientY || (event.touches && event.touches[0].clientY);
            
            if (!clientX || !clientY) return;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);

            if (intersects.length > 0 && currentTool) {
                const point = intersects[0].point;
                // Snap to nearest 1-unit grid coordinates
                const snapX = Math.round(point.x);
                const snapZ = Math.round(point.z);
                
                const heightOffset = currentTool.type === 'pool' ? -0.3 : (currentTool.type === 'wall' || currentTool.type === 'pillar' ? 1.5 : 0.5);
                previewMesh.position.set(snapX, heightOffset, snapZ);
            }
        }

        window.addEventListener('pointermove', updatePointerPosition);
        window.addEventListener('pointerdown', () => { pointerDownTime = Date.now(); });

        window.addEventListener('pointerup', (event) => {
            // Prevent placing when dragging the camera view (short tap vs long drag)
            if (Date.now() - pointerDownTime > 250) return;

            if (!currentTool || event.target.closest('#build-menu')) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObject(ground);

            if (intersects.length > 0) {
                if (budget < currentTool.cost) {
                    alert("Insufficient Budget!");
                    return;
                }

                const point = intersects[0].point;
                const snapX = Math.round(point.x);
                const snapZ = Math.round(point.z);

                let geometry, material, mesh;

                if (currentTool.type === 'wall') {
                    geometry = new THREE.BoxGeometry(3, 2, 0.4);
                } else if (currentTool.type === 'pillar') {
                    geometry = new THREE.CylinderGeometry(0.4, 0.4, 3, 16);
                } else if (currentTool.type === 'pool') {
                    geometry = new THREE.BoxGeometry(4, 0.8, 4);
                }

                material = new THREE.MeshLambertMaterial({ color: currentTool.color });
                mesh = new THREE.Mesh(geometry, material);

                const heightOffset = currentTool.type === 'pool' ? -0.3 : 1.5;
                mesh.position.set(snapX, heightOffset, snapZ);
                
                scene.add(mesh);

                // Deduct cost
                budget -= currentTool.cost;
                document.getElementById('budget-display').innerText = budget.toLocaleString('en-IN');
            }
        });

        // 6. Animation Loop
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
