<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>100 Cr House Builder Simulator</title>
    <style>
        body { margin: 0; overflow: hidden; font-family: Arial, sans-serif; user-select: none; touch-action: none; }
        
        #top-bar {
            position: absolute;
            top: 10px;
            left: 10px;
            right: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            pointer-events: none;
            z-index: 10;
        }

        #ui-overlay {
            color: #ffffff;
            background: rgba(0, 0, 0, 0.85);
            padding: 10px 14px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto;
            max-width: 230px;
        }
        h2 { margin: 0 0 4px 0; font-size: 14px; color: #ffca28; }
        p { margin: 2px 0; font-size: 11px; }
        
        #env-controls {
            background: rgba(0, 0, 0, 0.85);
            padding: 10px;
            border-radius: 8px;
            color: white;
            font-size: 11px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: auto;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .env-btn {
            background: #27ae60;
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            font-size: 10px;
        }

        #floor-selector {
            display: flex;
            gap: 4px;
            margin-top: 4px;
        }
        .floor-btn {
            background: #34495e;
            color: white;
            border: 1px solid #7f8c8d;
            padding: 4px 6px;
            border-radius: 4px;
            font-size: 10px;
            cursor: pointer;
            flex: 1;
            font-weight: bold;
        }
        .floor-btn.active {
            background: #f1c40f;
            color: #000;
            border-color: #f39c12;
        }

        #build-menu-container {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 92%;
            max-width: 540px;
            background: rgba(0, 0, 0, 0.85);
            padding: 8px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            z-index: 10;
        }
        #build-menu {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            white-space: nowrap;
            padding-bottom: 4px;
        }
        #build-menu::-webkit-scrollbar { height: 4px; }
        #build-menu::-webkit-scrollbar-thumb { background: #ffca28; border-radius: 4px; }
        
        .build-btn {
            background: #2c3e50;
            color: white;
            border: 2px solid #555;
            padding: 8px 10px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            font-size: 11px;
            text-align: center;
            flex: 0 0 auto;
        }
        .build-btn.selected {
            border-color: #ffca28;
            background: #34495e;
            box-shadow: 0 0 8px #ffca28;
        }
        .build-btn.eraser {
            background: #c0392b;
            border-color: #e74c3c;
        }
    </style>
    <!-- Three.js & OrbitControls -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>

    <div id="top-bar">
        <div id="ui-overlay">
            <h2>₹100 Cr House Builder</h2>
            <p><strong>Budget:</strong> ₹<span id="budget-display">1,00,00,00,000</span></p>
            <p><strong>Selected:</strong> <span id="tool-display" style="color: #ffca28;">None</span></p>
            <p><strong>Structural Integrity:</strong> <span id="stability-display" style="color: #00d2d3;">100%</span></p>
            <p><strong>Comfort Rating:</strong> <span id="comfort-display" style="color: #e84393;">0 Score</span></p>
            <p><strong>Water Pressure:</strong> <span id="water-display" style="color: #0984e3;">0 PSI</span></p>
            <p><strong>Power Grid:</strong> <span id="power-display" style="color: #f1c40f;">0 / 0 kW</span></p>
            <p><strong>Air Temp / HVAC:</strong> <span id="air-display" style="color: #1abc9c;">28°C (Normal)</span></p>
            <p><strong>Estate Value:</strong> ₹<span id="value-display">0</span></p>
            <p><strong>Time:</strong> <span id="time-display" style="color: #ffca28;">12:00 PM (Day)</span></p>
        </div>

        <div id="env-controls">
            <strong>Environment</strong>
            <div id="floor-selector">
                <button class="floor-btn active" onclick="setFloorLevel(0, this)">G-Flr</button>
                <button class="floor-btn" onclick="setFloorLevel(2.0, this)">1st-Flr</button>
                <button class="floor-btn" onclick="setFloorLevel(4.0, this)">2nd-Flr</button>
            </div>
            <button class="env-btn" onclick="toggleAutoClock()">⏰ Toggle Auto-Time</button>
            <button class="env-btn" style="background:#e67e22;" onclick="toggleWeather()">🌧️ Rain/Sun</button>
            <button class="env-btn" style="background:#c0392b;" onclick="resetSite()">🗑️ Reset Site</button>
        </div>
    </div>

    <div id="build-menu-container">
        <div id="build-menu">
            <button id="btn-wall" class="build-btn" onclick="selectTool('wall', 500000, 0xdcdcdc)">🧱 Wall<br>₹5L</button>
            <button id="btn-pillar" class="build-btn" onclick="selectTool('pillar', 200000, 0x555555)">🏛️ Pillar<br>₹2L</button>
            <button id="btn-marble" class="build-btn" onclick="selectTool('marble', 1500000, 0xf5f5f5)">✨ Marble<br>₹15L</button>
            <button id="btn-glass" class="build-btn" onclick="selectTool('glass', 800000, 0x88ccff)">🪟 Glass<br>₹8L</button>
            <button id="btn-light" class="build-btn" onclick="selectTool('light', 100000, 0xf1c40f)">💡 Lamp<br>₹1L</button>
            <button id="btn-sofa" class="build-btn" onclick="selectTool('sofa', 300000, 0xd63031)">🛋️ Sofa<br>₹3L</button>
            <button id="btn-bed" class="build-btn" onclick="selectTool('bed', 500000, 0x6c5ce7)">🛏️ Bed<br>₹5L</button>
            <button id="btn-kitchen" class="build-btn" onclick="selectTool('kitchen', 800000, 0x00cec9)">🍳 Kitchen<br>₹8L</button>
            <button id="btn-tank" class="build-btn" onclick="selectTool('tank', 400000, 0x0984e3)">🚰 Tank<br>₹4L</button>
            <button id="btn-pipe" class="build-btn" onclick="selectTool('pipe', 50000, 0x74b9ff)">🔧 Pipe<br>₹50K</button>
            <button id="btn-generator" class="build-btn" onclick="selectTool('generator', 1000000, 0xd35400)">⚡ Gen<br>₹10L</button>
            <button id="btn-hvac" class="build-btn" onclick="selectTool('hvac', 1200000, 0x16a085)">❄️ HVAC<br>₹12L</button>
            <button id="btn-solar" class="build-btn" onclick="selectTool('solar', 3000000, 0x1a237e)">☀️ Solar<br>₹30L</button>
            <button id="btn-tree" class="build-btn" onclick="selectTool('tree', 200000, 0x27ae60)">🌳 Tree<br>₹2L</button>
            <button id="btn-driveway" class="build-btn" onclick="selectTool('driveway', 300000, 0x7f8c8d)">🛣️ Driveway<br>₹3L</button>
            <button id="btn-car" class="build-btn" onclick="selectTool('car', 5000000, 0xc0392b)">🏎️ Sports Car<br>₹50L</button>
            <button id="btn-pool" class="build-btn" onclick="selectTool('pool', 2500000, 0x1e90ff)">🏊 Pool<br>₹25L</button>
            <button id="btn-eraser" class="build-btn eraser" onclick="selectTool('eraser', 0, 0x000000)">🧹 Eraser</button>
        </div>
    </div>

    <script>
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playSound(type) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'build') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.15);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.15);
            } else if (type === 'delete') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(250, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.2);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.2);
            }
        }

        let budget = localStorage.getItem('house_budget') ? parseInt(localStorage.getItem('house_budget')) : 1000000000;
        let estateValue = localStorage.getItem('house_value') ? parseInt(localStorage.getItem('house_value')) : 0;
        let currentTool = null;
        let activeFloorElevation = 0;
        let timeOfDay = 12;
        let autoTimeRunning = false;
        let isRaining = false;
        let placedObjects = [];
        let lightFixtures = [];

        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87ceeb);
        scene.fog = new THREE.FogExp2(0x87ceeb, 0.015);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(12, 14, 18);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true;
        document.body.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.5);
        scene.add(ambientLight);

        const sunLight = new THREE.DirectionalLight(0xffffff, 1.0);
        sunLight.position.set(15, 30, 15);
        sunLight.castShadow = true;
        scene.add(sunLight);

        const outerGroundGeo = new THREE.PlaneGeometry(500, 500);
        const outerGroundMat = new THREE.MeshStandardMaterial({ color: 0x388e3c, roughness: 0.9 });
        const outerGround = new THREE.Mesh(outerGroundGeo, outerGroundMat);
        outerGround.rotation.x = -Math.PI / 2;
        outerGround.position.y = -0.05;
        outerGround.receiveShadow = true;
        scene.add(outerGround);

        const groundGeometry = new THREE.BoxGeometry(30, 2, 30);
        const groundMaterial = [
            new THREE.MeshStandardMaterial({ color: 0x5d4037 }),
            new THREE.MeshStandardMaterial({ color: 0x5d4037 }),
            new THREE.MeshStandardMaterial({ color: 0x4caf50, roughness: 0.8 }),
            new THREE.MeshStandardMaterial({ color: 0x5d4037 }),
            new THREE.MeshStandardMaterial({ color: 0x5d4037 }),
            new THREE.MeshStandardMaterial({ color: 0x5d4037 })
        ];
        const ground = new THREE.Mesh(groundGeometry, groundMaterial);
        ground.position.y = -1;
        ground.receiveShadow = true;
        scene.add(ground);

        const grid = new THREE.GridHelper(30, 30, 0xffffff, 0x2e7d32);
        grid.position.y = 0.01;
        scene.add(grid);

        const raindropCount = 500;
        const rainGeometry = new THREE.BufferGeometry();
        const rainPositions = [];
        for (let i = 0; i < raindropCount; i++) {
            rainPositions.push((Math.random() - 0.5) * 40, Math.random() * 25, (Math.random() - 0.5) * 40);
        }
        rainGeometry.setAttribute('position', new THREE.Float32BufferAttribute(rainPositions, 3));
        const rainMaterial = new THREE.PointsMaterial({ color: 0xaaaaff, size: 0.15, transparent: true, opacity: 0.7 });
        const rainSystem = new THREE.Points(rainGeometry, rainMaterial);
        rainSystem.visible = false;
        scene.add(rainSystem);

        document.getElementById('budget-display').innerText = budget.toLocaleString('en-IN');
        document.getElementById('value-display').innerText = estateValue.toLocaleString('en-IN');

        function setFloorLevel(height, btn) {
            activeFloorElevation = height;
            document.querySelectorAll('.floor-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
        }

        function updateAnalytics() {
            let walls = placedObjects.filter(p => p.type === 'wall' || p.type === 'glass').length;
            let pillars = placedObjects.filter(p => p.type === 'pillar').length;
            let furniture = placedObjects.filter(p => p.type === 'sofa' || p.type === 'bed' || p.type === 'kitchen' || p.type === 'pool' || p.type === 'tree' || p.type === 'light' || p.type === 'car').length;
            let tanks = placedObjects.filter(p => p.type === 'tank').length;
            let pipes = placedObjects.filter(p => p.type === 'pipe').length;
            let generators = placedObjects.filter(p => p.type === 'generator').length;
            let solar = placedObjects.filter(p => p.type === 'solar').length;
            let hvac = placedObjects.filter(p => p.type === 'hvac').length;

            let stability = 100;
            if (walls > 0 && pillars === 0) stability = 60;
            else if (walls > pillars * 3) stability = 80;

            const stabEl = document.getElementById('stability-display');
            stabEl.innerText = stability + "%";
            stabEl.style.color = stability < 70 ? "#e74c3c" : (stability < 90 ? "#f39c12" : "#00d2d3");

            let comfortScore = furniture * 12 + placedObjects.filter(p => p.type === 'marble' || p.type === 'driveway' || p.type === 'pool').length * 8 + hvac * 25;
            document.getElementById('comfort-display').innerText = comfortScore + " Score";

            let psi = tanks * 35 + pipes * 5;
            if (isRaining && tanks > 0) psi += 20;
            document.getElementById('water-display').innerText = psi + " PSI";

            let powerSupplyKW = generators * 50 + solar * 15;
            let powerDemandKW = hvac * 12 + furniture * 2 + tanks * 5;
            const pwrEl = document.getElementById('power-display');
            pwrEl.innerText = `${powerDemandKW} / ${powerSupplyKW} kW`;
            pwrEl.style.color = powerDemandKW > powerSupplyKW ? "#e74c3c" : "#f1c40f";

            let baseTemp = isRaining ? 22 : 32;
            let cooledTemp = Math.max(18, baseTemp - hvac * 4);
            const airEl = document.getElementById('air-display');
            airEl.innerText = `${cooledTemp}°C (${hvac > 0 ? 'HVAC Cooled' : 'Ambient'})`;
            airEl.style.color = hvac > 0 ? "#00cec9" : "#e67e22";
        }

        function toggleAutoClock() {
            autoTimeRunning = !autoTimeRunning;
        }

        function updateEnvironmentTime(delta) {
            if (!autoTimeRunning) return;
            timeOfDay += delta * 0.5;
            if (timeOfDay >= 24) timeOfDay = 0;

            let hours = Math.floor(timeOfDay);
            let mins = Math.floor((timeOfDay - hours) * 60);
            let timeStr = `${hours % 12 === 0 ? 12 : hours % 12}:${mins < 10 ? '0' : ''}${mins} ${hours >= 12 ? 'PM' : 'AM'}`;

            let sunAngle = (timeOfDay / 24) * Math.PI * 2;
            sunLight.position.x = Math.cos(sunAngle) * 30;
            sunLight.position.y = Math.sin(sunAngle) * 30;

            let isNight = timeOfDay < 6 || timeOfDay >= 18;

            lightFixtures.forEach(pLight => {
                pLight.intensity = isNight ? 2.0 : 0.0;
            });

            if (!isNight) {
                scene.background.setHex(0x87ceeb);
                scene.fog.color.setHex(0x87ceeb);
                sunLight.intensity = 1.0;
                document.getElementById('time-display').innerText = timeStr + " (Day)";
                document.getElementById('time-display').style.color = "#ffca28";
            } else {
                scene.background.setHex(0x0b1d3a);
                scene.fog.color.setHex(0x0b1d3a);
                sunLight.intensity = 0.1;
                document.getElementById('time-display').innerText = timeStr + " (Night)";
                document.getElementById('time-display').style.color = "#00d2d3";
            }
        }

        function toggleWeather() {
            isRaining = !isRaining;
            rainSystem.visible = isRaining;
            updateAnalytics();
        }

        const raycastPlaneGeo = new THREE.PlaneGeometry(30, 30);
        const raycastPlaneMat = new THREE.MeshBasicMaterial({ visible: false });
        const raycastPlane = new THREE.Mesh(raycastPlaneGeo, raycastPlaneMat);
        raycastPlane.rotation.x = -Math.PI / 2;
        scene.add(raycastPlane);

        const previewMaterial = new THREE.MeshBasicMaterial({ color: 0x00ff00, transparent: true, opacity: 0.5 });
        let previewMesh = new THREE.Mesh(new THREE.BoxGeometry(1, 1, 1), previewMaterial);
        previewMesh.visible = false;
        scene.add(previewMesh);

        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();
        let pointerDownTime = 0;

        function selectTool(type, cost, color) {
            document.querySelectorAll('.build-btn').forEach(btn => btn.classList.remove('selected'));
            
            if (currentTool && currentTool.type === type) {
                currentTool = null;
                previewMesh.visible = false;
                document.getElementById('tool-display').innerText = "None";
                return;
            }

            currentTool = { type, cost, color };
            document.getElementById(`btn-${type}`).classList.add('selected');
            document.getElementById('tool-display').innerText = type === 'eraser' ? 'ERASER' : type.toUpperCase();

            if (type === 'eraser') {
                previewMesh.visible = false;
                return;
            }

            if (type === 'wall' || type === 'glass') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.BoxGeometry(3, 2, 0.4);
            } else if (type === 'pillar') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.CylinderGeometry(0.4, 0.4, 3, 16);
            } else if (type === 'marble' || type === 'driveway') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.BoxGeometry(3, 0.1, 3);
            } else if (type === 'light') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.SphereGeometry(0.4, 16, 16);
            } else if (type === 'sofa') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.BoxGeometry(2, 0.8, 1);
            } else if (type === 'bed') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.BoxGeometry(2.2, 0.6, 2);
            } else if (type === 'kitchen') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.BoxGeometry(2.5, 0.9, 0.8);
            } else if (type === 'tank') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.CylinderGeometry(1, 1, 2, 16);
            } else if (type === 'pipe') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.CylinderGeometry(0.1, 0.1, 3, 8);
            } else if (type === 'generator') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.BoxGeometry(2, 1.2, 1.5);
            } else if (type === 'hvac') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.BoxGeometry(1.8, 1.2, 1.2);
            } else if (type === 'solar') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.BoxGeometry(2.5, 0.2, 2.5);
            } else if (type === 'tree') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.ConeGeometry(1, 3, 8);
            } else if (type === 'car') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.BoxGeometry(2.2, 0.8, 4.2);
            } else if (type === 'pool') {
                previewMesh.geometry.dispose();
                previewMesh.geometry = new THREE.BoxGeometry(4, 0.8, 4);
            }
            previewMesh.visible = true;
        }

        window.addEventListener('pointermove', (event) => {
            let clientX = event.clientX || (event.touches && event.touches[0].clientX);
            let clientY = event.clientY || (event.touches && event.touches[0].clientY);
            if (!clientX || !clientY) return;

            mouse.x = (clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(clientY / window.innerHeight) * 2 + 1;

            if (currentTool && currentTool.type !== 'eraser') {
                raycaster.setFromCamera(mouse, camera);
                const intersects = raycaster.intersectObject(raycastPlane);
                if (intersects.length > 0) {
                    const point = intersects[0].point;
                    let hOffset = activeFloorElevation + 0.4;
                    if (currentTool.type === 'pool') hOffset = -0.3;
                    if (currentTool.type === 'pipe' || currentTool.type === 'marble' || currentTool.type === 'driveway') hOffset = activeFloorElevation + 0.05;
                    if (currentTool.type === 'light') hOffset = activeFloorElevation + 1.8;
                    if (currentTool.type === 'tank' || currentTool.type === 'generator' || currentTool.type === 'hvac') hOffset = activeFloorElevation + 0.6;
                    if (currentTool.type === 'tree') hOffset = activeFloorElevation + 1.5;
                    if (currentTool.type === 'car') hOffset = activeFloorElevation + 0.4;
                    if (currentTool.type === 'solar') hOffset = activeFloorElevation + 2.1;
                    if (currentTool.type === 'wall' || currentTool.type === 'glass' || currentTool.type === 'pillar') hOffset = activeFloorElevation + 1.0;
                    previewMesh.position.set(Math.round(point.x), hOffset, Math.round(point.z));
                }
            }
        });

        window.addEventListener('pointerdown', () => { pointerDownTime = Date.now(); });

        window.addEventListener('pointerup', (event) => {
            if (Date.now() - pointerDownTime > 250) return;
            if (!currentTool || event.target.closest('#build-menu-container') || event.target.closest('#top-bar')) return;

            raycaster.setFromCamera(mouse, camera);

            if (currentTool.type === 'eraser') {
                const intersects = raycaster.intersectObjects(placedObjects.map(p => p.mesh));
                if (intersects.length > 0) {
                    const hitMesh = intersects[0].object;
                    const index = placedObjects.findIndex(p => p.mesh === hitMesh);
                    if (index !== -1) {
                        playSound('delete');
                        
                        if (placedObjects[index].pointLight) {
                            scene.remove(placedObjects[index].pointLight);
                            lightFixtures = lightFixtures.filter(l => l !== placedObjects[index].pointLight);
                        }

                        scene.remove(hitMesh);
                        budget += Math.floor(placedObjects[index].cost * 0.5);
                        estateValue -= placedObjects[index].cost;
                        placedObjects.splice(index, 1);
                        document.getElementById('budget-display').innerText = budget.toLocaleString('en-IN');
                        document.getElementById('value-display').innerText = estateValue.toLocaleString('en-IN');
                        localStorage.setItem('house_budget', budget);
                        localStorage.setItem('house_value', estateValue);
                        updateAnalytics();
                    }
                }
                return;
            }

            const intersects = raycaster.intersectObject(raycastPlane);
            if (intersects.length > 0) {
                if (budget < currentTool.cost) {
                    alert("Insufficient Budget!");
                    return;
                }

                playSound('build');
                const point = intersects[0].point;
                let geometry, material, mesh, pointLightObj = null;
                let snapX = Math.round(point.x);
                let snapZ = Math.round(point.z);
                let hOffset = activeFloorElevation + 0.4;

                if (currentTool.type === 'wall') {
                    geometry = new THREE.BoxGeometry(3, 2, 0.4);
                    material = new THREE.MeshStandardMaterial({ color: currentTool.color, roughness: 0.5 });
                    hOffset = activeFloorElevation + 1.0;
                } else if (currentTool.type === 'pillar') {
                    geometry = new THREE.CylinderGeometry(0.4, 0.4, 3, 16);
                    material = new THREE.MeshStandardMaterial({ color: currentTool.color, roughness: 0.3 });
                    hOffset = activeFloorElevation + 1.0;
                } else if (currentTool.type === 'marble') {
                    geometry = new THREE.BoxGeometry(3, 0.1, 3);
                    material = new THREE.MeshStandardMaterial({ color: currentTool.color, roughness: 0.1 });
                    hOffset = activeFloorElevation + 0.05;
                } else if (currentTool.type === 'driveway') {
                    geometry = new THREE.BoxGeometry(3, 0.05, 3);
                    material = new THREE.MeshStandardMaterial({ color: currentTool.color, roughness: 0.9 });
                    hOffset = activeFloorElevation + 0.03;
                } else if (currentTool.type === 'glass') {
                    geometry = new THREE.BoxGeometry(3, 2, 0.4);
                    material = new THREE.MeshStandardMaterial({ color: currentTool.color, transparent: true, opacity: 0.4, roughness: 0.1 });
                    hOffset = activeFloorElevation + 1.0;
                } else if (currentTool.type === 'light') {
                    geometry = new THREE.SphereGeometry(0.3, 16, 16);
                    material = new THREE.MeshBasicMaterial({ color: 0xfff0a5 });
                    hOffset = activeFloorElevation + 1.8;

                    pointLightObj = new THREE.PointLight(0xfff0a5, 0.0, 10);
                    pointLightObj.position.set(snapX, hOffset, snapZ);
                    scene.add(pointLightObj);
                    lightFixtures.push(pointLightObj);
                } else if (currentTool.type === 'sofa') {
                    geometry = new THREE.BoxGeometry(2, 0.8, 1);
                    material = new THREE.MeshStandardMaterial({ color: currentTool.color, roughness: 0.8 });
                } else if (currentTool.type === 'bed') {
                    geometry = new THREE.BoxGeometry(2.2, 0.6, 2);
                    material = new THREE.MeshStandardMaterial({ color: currentTool.color, roughness: 0.6 });
                } else if (currentTool.type === 'kitchen') {
                    geometry = new THREE.BoxGeometry(2.5, 0.9, 0.8);
                    material = new THREE.MeshStandardMaterial({ color: currentTool.color, roughness: 0.2, metalness: 0.3 });
                } else if (currentTool.type === 'tank') {
                    geometry = new THREE.CylinderGeometry(1, 1, 2, 16);
                    material = new THREE.MeshStandardMaterial({ color: currentTool.color, roughness: 0.2, metalness: 0.5 });
                    hOffset = activeFloorElevation + 1.0;
                } else if (currentTool.type === 'pipe') {
                    geometry = new THREE.CylinderGeometry(0.1, 0.1, 3, 8);
                    material = new THREE.MeshStandardMaterial({ color: currentTool.color, roughness: 0.1, metalness: 0.8 });
                    hOffset = activeFloorElevation + 0.05;
                } else if (currentTool.type === 'generator') {
                    geometry = new THREE.BoxGeometry(2, 1.2, 1.5);
                    material = new THREE.MeshStandardMaterial({ color: currentTool.color, roughness: 0.4, metalness: 0.6 });
                    hOffset = activeFloorElevation + 0.6;
                } else if (currentTool.type === 'hvac') {
                    geometry = new THREE.BoxGeometry(1.8, 1.2, 1.2);
                    material = new THREE.MeshStandardMaterial({ color: currentTool.color, roughness: 0.3, metalness: 0.5 });
                    hOffset = activeFloorElevation + 0.6;
                } else if (currentTool.type === 'solar') {
                    geometry = new THREE.BoxGeometry(2.5, 0.2, 2.5);
                    material = new THREE.MeshStandardMaterial({ color: currentTool.color, roughness: 0.2, metalness: 0.8 });
                    hOffset = activeFloorElevation + 2.1;
                } else if (currentTool.type === 'tree') {
                    geometry = new THREE.ConeGeometry(1, 3, 8);
                    material = new THREE.MeshStandardMaterial({ color: currentTool.color, roughness: 0.9 });
                    hOffset = activeFloorElevation + 1.5;
                } else if (currentTool.type === 'car') {
                    geometry = new THREE.BoxGeometry(2.2, 0.8, 4.2);
                    material = new THREE.MeshStandardMaterial({ color: currentTool.color, roughness: 0.1, metalness: 0.8 });
                    hOffset = activeFloorElevation + 0.4;
                } else if (currentTool.type === 'pool') {
                    geometry = new THREE.BoxGeometry(4, 0.8, 4);
                    material = new THREE.MeshStandardMaterial({ color: currentTool.color, roughness: 0.1, transparent: true, opacity: 0.8 });
                    hOffset = -0.3;
                }

                mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.position.set(snapX, hOffset, snapZ);
                scene.add(mesh);

                placedObjects.push({ mesh: mesh, type: currentTool.type, cost: currentTool.cost, pointLight: pointLightObj });

                budget -= currentTool.cost;
                estateValue += currentTool.cost;
                document.getElementById('budget-display').innerText = budget.toLocaleString('en-IN');
                document.getElementById('value-display').innerText = estateValue.toLocaleString('en-IN');
                localStorage.setItem('house_budget', budget);
                localStorage.setItem('house_value', estateValue);
                updateAnalytics();
            }
        });

        function resetSite() {
            if (confirm("Are you sure you want to reset your entire construction site and refund your budget?")) {
                localStorage.clear();
                location.reload();
            }
        }

        let lastTime = 0;
        function animate(timestamp) {
            requestAnimationFrame(animate);
            let delta = (timestamp - lastTime) * 0.001;
            lastTime = timestamp;

            updateEnvironmentTime(isNaN(delta) ? 0.016 : delta);

            if (isRaining) {
                const positions = rainSystem.geometry.attributes.position.array;
                for (let i = 1; i < positions.length; i += 3) {
                    positions[i] -= 0.5;
                    if (positions[i] < 0) positions[i] = 25;
                }
                rainSystem.geometry.attributes.position.needsUpdate = true;
            }

            controls.update();
            renderer.render(scene, camera);
        }
        animate(0);

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
